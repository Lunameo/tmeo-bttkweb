<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Biểu mẫu đăng ký hội thảo công nghệ</title>
</head>
<body style="font-family: 'Times New Roman', serif; display:flex; justify-content:center; padding:40px 10px; background:#f5f5f5;">

<form>
<table style="border-collapse: collapse; width:700px; border:1px solid #4a90d9;">

  <!-- Dòng tiêu đề -->
  <tr>
    <td colspan="2" style="background-color:#7ec3f0; text-align:center; font-weight:bold; font-size:18px; padding:12px; border:1px solid #4a90d9;">
      Biểu mẫu đăng ký hội thảo công nghệ
    </td>
  </tr>

  <!-- Họ tên -->
  <tr>
    <td style="width:35%; font-weight:bold; background-color:#eaf4fd; border:1px solid #4a90d9; padding:8px 12px;">Họ tên</td>
    <td style="border:1px solid #4a90d9; padding:8px 12px;">
      <input type="text" placeholder="Nhập tên của bạn" style="width:95%; padding:5px;">
    </td>
  </tr>

  <!-- Email -->
  <tr style="background-color:#f7fbff;">
    <td style="width:35%; font-weight:bold; background-color:#eaf4fd; border:1px solid #4a90d9; padding:8px 12px;">Email</td>
    <td style="border:1px solid #4a90d9; padding:8px 12px;">
      <input type="email" placeholder="Nhập email" style="width:95%; padding:5px;">
    </td>
  </tr>

  <!-- Chủ đề -->
  <tr>
    <td style="width:35%; font-weight:bold; background-color:#eaf4fd; border:1px solid #4a90d9; padding:8px 12px;">Chủ đề bạn quan tâm</td>
    <td style="border:1px solid #4a90d9; padding:8px 12px;">
      <select style="width:95%; padding:5px;">
        <option>Trí tuệ nhân tạo</option>
        <option>Điện toán đám mây</option>
        <option>An ninh mạng</option>
        <option>Phát triển phần mềm</option>
        <option>Blockchain</option>
      </select>
    </td>
  </tr>

  <!-- Radio -->
  <tr style="background-color:#f7fbff;">
    <td style="width:35%; font-weight:bold; background-color:#eaf4fd; border:1px solid #4a90d9; padding:8px 12px;">Bạn đã tham gia hội thảo trước đây chưa?</td>
    <td style="border:1px solid #4a90d9; padding:8px 12px;">
      <label style="margin-right:15px;"><input type="radio" name="attended"> Có</label>
      <label><input type="radio" name="attended"> Chưa</label>
    </td>
  </tr>

  <!-- Checkbox -->
  <tr>
    <td style="width:35%; font-weight:bold; background-color:#eaf4fd; border:1px solid #4a90d9; padding:8px 12px;">Thời gian bạn có thể tham dự</td>
    <td style="border:1px solid #4a90d9; padding:8px 12px;">
      <label style="margin-right:15px;"><input type="checkbox"> Sáng</label>
      <label style="margin-right:15px;"><input type="checkbox"> Chiều</label>
      <label><input type="checkbox"> Tối</label>
    </td>
  </tr>

  <!-- Textarea -->
  <tr style="background-color:#f7fbff;">
    <td style="width:35%; font-weight:bold; background-color:#eaf4fd; border:1px solid #4a90d9; padding:8px 12px;">Câu hỏi dành cho diễn giả</td>
    <td style="border:1px solid #4a90d9; padding:8px 12px;">
      <textarea style="width:95%; height:70px;"></textarea>
    </td>
  </tr>

  <!-- Nút -->
  <tr>
    <td colspan="2" style="text-align:center; background-color:#eaf4fd; border:1px solid #4a90d9; padding:8px 12px;">
      <button type="submit" style="padding:6px 18px; background-color:#eaf4fd; border:1px solid #4a90d9; cursor:pointer;">Đăng ký</button>
    </td>
  </tr>

</table>
</form>

</body>
</html>
