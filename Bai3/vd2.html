<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Khảo sát đăng ký tài khoản thành viên</title>
</head>
<body style="font-family:'Times New Roman',serif; display:flex; justify-content:center; padding:40px 10px; background:#f5f5f5;">

<div style="width:620px; border:1px solid #4a90d9;">


  <div style="background-color:#7ec3f0; text-align:center; font-weight:bold; font-size:22px; padding:20px;">
    Khảo sát đăng ký tài khoản thành viên
  </div>

  <div style="background-color:#ffffff; padding:20px;">
    <form>

      <fieldset style="border:1px solid #999; margin-bottom:20px; padding:15px 20px;">
        <legend style="font-weight:bold; padding:0 6px;">Thông tin cá nhân</legend>

        <div style="display:flex; align-items:center; margin-bottom:12px;">
          <label style="width:160px;">Họ tên:</label>
          <input type="text" name="hoten" style="width:300px; padding:4px 6px;">
        </div>

        <div style="display:flex; align-items:center; margin-bottom:12px;">
          <label style="width:160px;">Email:</label>
          <input type="email" name="email" style="width:300px; padding:4px 6px;">
        </div>

        <div style="display:flex; align-items:center; margin-bottom:12px;">
          <label style="width:160px;">Số điện thoại:</label>
          <input type="text" name="sdt" style="width:300px; padding:4px 6px;">
        </div>

        <div style="display:flex; align-items:center; margin-bottom:12px;">
          <label style="width:160px;">Ngày sinh:</label>
          <input type="date" name="ngaysinh" style="width:300px; padding:4px 6px;">
        </div>

        <div style="display:flex; align-items:center; margin-bottom:12px;">
          <label style="width:160px;">Mật khẩu:</label>
          <input type="password" name="matkhau" style="width:300px; padding:4px 6px;">
        </div>
      </fieldset>

      <fieldset style="border:1px solid #999; margin-bottom:20px; padding:15px 20px;">
        <legend style="font-weight:bold; padding:0 6px;">Tùy chọn tài khoản</legend>

        <div style="display:flex; align-items:center; margin-bottom:12px;">
          <label style="width:160px;">Chọn gói thành viên:</label>
          <select name="goithanhvien" style="width:300px; padding:4px 6px;">
            <option>Miễn phí</option>
            <option>Cơ bản</option>
            <option>Cao cấp</option>
          </select>
        </div>

        <div style="display:flex; align-items:center; margin-bottom:12px;">
          <label style="width:160px;">Tải ảnh đại diện:</label>
          <input type="file" name="anhdaidien">
        </div>
      </fieldset>

    </form>
  </div>


  <div style="background-color:#7ec3f0; text-align:center; padding:15px;">
    <button type="submit" style="padding:6px 18px; background-color:#eaf4fd; border:1px solid #4a90d9; cursor:pointer; margin:0 5px;">Đăng ký</button>
    <button type="reset" style="padding:6px 18px; background-color:#eaf4fd; border:1px solid #4a90d9; cursor:pointer; margin:0 5px;">Nhập lại</button>
  </div>

</div>

</body>
</html>
