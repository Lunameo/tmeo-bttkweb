<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Times New Roman, Times, serif;
        }

        .outer {
            max-width: 700px;
            margin: 20px auto;
            border: 2px solid #000;
            
            padding: 20px;
        }

        .outer h1 {
            text-align: center;
            color: #1a1acc;
            font-size: 30px;
            margin: 5px 0 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            background: #f8ccd6;
            padding: 10px 14px;
            vertical-align: middle;
        }

        td:first-child {
            font-weight: bold;
            color: #1a1acc;
            width: 170px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            padding: 6px 8px;
            border: 1px solid #999;
            border-radius: 3px;
            font-family: inherit;
            font-size: 14px;
        }

        input[type="text"],
        input[type="tel"] {
            width: 100%;
        }

        textarea {
            width: 100%;
            resize: vertical;
        }

        .checkbox-group label {
            font-weight: bold;
            color: #1a1acc;
            margin-right: 18px;
        }

        fieldset {
            border: 2px solid #333;
            border-radius: 4px;
            padding: 12px 18px;
        }

        legend {
            font-style: italic;
            font-weight: bold;
            color: #1a1acc;
            padding: 0 8px;
        }

        fieldset label {
            font-weight: bold;
            color: #1a1acc;
            margin-right: 10px;
        }

        button {
            padding: 8px 26px;
            background: #eeeeee;
            border: 1px solid #888;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="outer" style="font-family: 'Times New Roman', Times, serif;">
        <h1>Đặt phòng khách sạn</h1>
        <form>
            <table border="2" style="width: 100%;text-align: left;">
                <tr>
                    <td class="">Họ và tên</td>
                    <td><input type="text" placeholder="Nguyễn Hoàng Anh"></td>
                </tr>
                <tr>
                    <td class="">Giới tính</td>
                    <td>
                        <input type="radio" name="gt" value="Nam"> Nam
                        <input type="radio" name="gt" value="Nữ"> Nữ
                        <input type="radio" name="gt" value="Khác"> Khác
                    </td>
                </tr>
                <tr>
                    <td class="">Địa chỉ</td>
                    <td><input type="text" placeholder="Phan Bội Châu - Hồ Chí Minh"></td>
                </tr>
                <tr>
                    <td class="">Số điện thoại</td>
                    <td><input type="tel" placeholder="0967989380"></td>
                </tr>
                <tr>
                    <td class="">Loại phòng</td>
                    <td class="checkbox-group">
                        <label><input type="checkbox" name="roomType" value="single"> Phòng đơn</label>
                        <label><input type="checkbox" name="roomType" value="double"> Phòng đôi</label>
                        <label><input type="checkbox" name="roomType" value="VIP"> Phòng VIP</label>
                    </td>
                </tr>
                <tr>
                    <td class="">Chọn khách sạn</td>
                    <td>
                        <select name="hotel">
                            <option value="hotel1">Khách sạn 3 sao</option>
                            <option value="hotel2">Khách sạn 4 sao</option>
                            <option value="hotel3">Khách sạn 5 sao</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <fieldset>
                            <legend>Ngày đặt</legend>
                            <label>Ngày đến<input type="date"></label>
                            <label>Ngày đi<input type="date"></label>
                        </fieldset>
                    </td>
                </tr>
                <tr>
                    <td class="">Ghi chú</td>
                    <td><textarea rows="4" cols="50" name=""></textarea></td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: center;">
                        <button type="submit">Đặt phòng</button>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="" style="text-align: center; color: rgba(192, 6, 6, 0.771);">
                        Đặt phòng thành công!
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
