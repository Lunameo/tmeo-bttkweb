<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    margin: 0;
    padding: 20px;
  }
  .card {
    max-width: 750px;
    margin: 0 auto;
    background: #e9ebfa;
    border-radius: 8px;
    padding: 25px 35px 35px;
  }
  .card h1 {
    text-align: center;
    color: #e6119c;
    font-size: 32px;
    margin: 5px 0 25px;
  }
  .content {
    display: flex;
    gap: 30px;
  }
  .image-col img {
    width: 260px;
    height: auto;
    display: block;
    border-radius: 4px;
  }
  .info-col {
    flex: 1;
  }
  .info-item {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    font-size: 16px;
    color: #222;
  }
  .icon {
    font-size: 20px;
    width: 26px;
    text-align: center;
    flex-shrink: 0;
  }
  hr {
    border: none;
    border-top: 1px solid #bbb;
    margin: 14px 0;
  }
  .info-col a {
    color: #2255cc;
    text-decoration: underline;
  }
</style>
</head>
<body>

    <div class="card" style="font-family: Time New Roman;">
    <h1>Công ty Hoa tươi Minh Vân</h1>
    <div class="content">
      <div class="image-col">
        <img src="https://cdnphoto.dantri.com.vn/tOguFshkAkVwvo89xG0NlDGjxNo=/thumb_w/1155/2022/03/05/bo-hoa-gia-tri-hoewn-100-trieu-dongnguyen-tu-1646443710841.jpeg" alt="Hoa tươi Minh Vân">
      </div>
      <div class="info-col">
        <div class="info-item"><span class="icon">📅</span> Thành lập: 25/05/2007</div>
        <div class="info-item"><span class="icon">🌸</span> Chuyên cung cấp hoa tươi</div>
        <div class="info-item"><span class="icon">🏪</span> Có trên 20 cửa hàng bán hoa tại Thái Nguyên</div>
        <div class="info-item"><span class="icon">🤝</span> Nhận kết giỏ hoa theo yêu cầu của khách hàng</div>
        <hr>
        <div class="info-item"><span class="icon">📞</span> Điện thoại: 84-08-8351056</div>
        <div class="info-item"><span class="icon">📍</span> Địa chỉ: 227 Lương Ngọc Quyến, TP. Thái Nguyên, T. Thái Nguyên</div>
        <div class="info-item"><span class="icon">🔒</span> @Copyright: <a href="#">IT</a></div>
      </div>
    </div>
  </div>
</body>
</html>
